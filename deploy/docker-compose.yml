services:
  memo:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      MEMO_DB_PATH: /data/memo.db
      MEMO_ADMIN_USERNAME: admin
      MEMO_ADMIN_PASSWORD: change-me-before-first-run
      MEMO_WEEKLY_RECIPIENTS: ""
      MEMO_MAIL_FROM: memo@example.com
      SPRING_MAIL_HOST: ""
      JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"
    volumes:
      - memo-data:/data
    ports:
      - "8081:8081"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - memo
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  memo-data:
  caddy-data:
  caddy-config:
