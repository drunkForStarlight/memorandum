server:
  port: 8081
  tomcat:
    uri-encoding: UTF-8
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    session:
      cookie:
        http-only: true
        same-site: lax

spring:
  application:
    name: memo-assistant
  datasource:
    url: jdbc:sqlite:${MEMO_DB_PATH:./data/memo.db}
    driver-class-name: org.sqlite.JDBC
  jackson:
    time-zone: Asia/Shanghai
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:25}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_AUTH:false}
          starttls:
            enable: ${SPRING_MAIL_STARTTLS:false}

memo:
  admin:
    username: ${MEMO_ADMIN_USERNAME:admin}
    password: ${MEMO_ADMIN_PASSWORD:admin123}
    display-name: ${MEMO_ADMIN_DISPLAY_NAME:Admin}
  mail:
    from: ${MEMO_MAIL_FROM:memo@example.com}
  weekly:
    recipients: ${MEMO_WEEKLY_RECIPIENTS:}
    cron: ${MEMO_WEEKLY_CRON:0 0 18 * * FRI}

logging:
  level:
    com.memoassistant: info
